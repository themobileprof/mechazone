name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: cloud-backend/go.mod
          cache-dependency-path: cloud-backend/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Go tests
        working-directory: cloud-backend
        run: GOTOOLCHAIN=local go test ./...
      - name: Worker tests
        working-directory: diagnostic-worker
        run: |
          python -m venv .venv
          .venv/bin/pip install -q -r requirements.txt pytest
          .venv/bin/python -m pytest tests/ -q
      - name: Client typecheck
        working-directory: client
        run: |
          npm ci --no-fund --no-audit
          npx tsc -b

  pack:
    needs: test
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: cloud-backend/go.mod
          cache-dependency-path: cloud-backend/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Native build tools
        run: sudo apt-get update -qq && sudo apt-get install -y libusb-1.0-0-dev pkg-config zip
      - name: Pack Linux and Windows amd64
        run: |
          chmod +x scripts/pack-release.sh
          ./scripts/pack-release.sh linux amd64
          ./scripts/pack-release.sh windows amd64
          ls -lh var/release
      - uses: actions/upload-artifact@v4
        with:
          name: mechazone-shop
          path: |
            var/release/*.tar.gz
            var/release/*.zip
          if-no-files-found: error
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            var/release/mechazone-linux-amd64.tar.gz
            var/release/mechazone-windows-amd64.zip
