  <text x="320" y="292" text-anchor="middle" fill="#8d8778" font-family="ui-monospace, monospace" font-size="13">4 chassis ground · 5 signal ground · 16 battery +</text>
  <text x="320" y="318" text-anchor="middle" fill="#8d8778" font-family="ui-monospace, monospace" font-size="12">6 CAN-H · 14 CAN-L on ISO 15765 cars · this is the DLC only</text>
  <text x="160" y="368" text-anchor="middle" fill="#d4a017" font-family="ui-monospace, monospace" font-size="12">4  5  GROUND</text>
  <text x="480" y="368" text-anchor="middle" fill="#3c8f5c" font-family="ui-monospace, monospace" font-size="12">16  BATT</text>
