      <rect x="278" y="108" width="42" height="48" rx="3" fill="#3c2410" stroke="#d4a017" stroke-width="2"/>
      <text x="299" y="138" fill="#d4a017">4</text>
      <rect x="328" y="108" width="42" height="48" rx="3" fill="#3c2410" stroke="#d4a017" stroke-width="2"/>
      <text x="349" y="138" fill="#d4a017">5</text>
      <rect x="378" y="108" width="42" height="48" rx="3" fill="#0c0b09" stroke="#8d8778"/>
      <text x="399" y="138" fill="#e8e0cf">6</text>
      <rect x="428" y="108" width="42" height="48" rx="3" fill="#0c0b09" stroke="#8d8778"/>
      <text x="449" y="138" fill="#e8e0cf">7</text>
      <rect x="478" y="108" width="42" height="48" rx="3" fill="#0c0b09" stroke="#8d8778"/>
      <text x="499" y="138" fill="#e8e0cf">8</text>
    </g>
    <g id="r2">
      <rect x="138" y="172" width="42" height="48" rx="3" fill="#0c0b09" stroke="#8d8778"/>
      <text x="159" y="202" fill="#e8e0cf">9</text>
      <rect x="188" y="172" width="42" height="48" rx="3" fill="#0c0b09" stroke="#8d8778"/>
      <text x="209" y="202" fill="#e8e0cf">10</text>
      <rect x="238" y="172" width="42" height="48" rx="3" fill="#0c0b09" stroke="#8d8778"/>
      <text x="259" y="202" fill="#e8e0cf">11</text>
      <rect x="288" y="172" width="42" height="48" rx="3" fill="#0c0b09" stroke="#8d8778"/>
      <text x="309" y="202" fill="#e8e0cf">12</text>
      <rect x="338" y="172" width="42" height="48" rx="3" fill="#0c0b09" stroke="#8d8778"/>
      <text x="359" y="202" fill="#e8e0cf">13</text>
      <rect x="388" y="172" width="42" height="48" rx="3" fill="#0c0b09" stroke="#8d8778"/>
      <text x="409" y="202" fill="#e8e0cf">14</text>
      <rect x="438" y="172" width="42" height="48" rx="3" fill="#0c0b09" stroke="#8d8778"/>
