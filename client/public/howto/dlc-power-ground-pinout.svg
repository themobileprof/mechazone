<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-labelledby="t d">
  <title id="t">SAE J1962 vehicle OBD-II socket, looking in</title>
  <desc id="d">Trapezoid female DLC, top row pins 18, bottom 916. Pin 16 battery, 4 chassis ground, 5 signal ground.</desc>
  <rect width="640" height="420" fill="#0c0b09"/>
  <text x="320" y="36" text-anchor="middle" fill="#d4a017" font-family="ui-monospace, monospace" font-size="14" letter-spacing="0.28em">LOOKING INTO THE CAR SOCKET</text>
  <text x="320" y="56" text-anchor="middle" fill="#8d8778" font-family="ui-monospace, monospace" font-size="11">SAE J1962 · wide side up · not a scan-tool plug</text>
  <polygon points="90,88 550,88 510,250 130,250" fill="#16140f" stroke="#d4a017" stroke-width="2"/>
  <!-- cavities 1-8 -->
  <g font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">
    <g id="r1">
      <rect x="128" y="108" width="42" height="48" rx="3" fill="#0c0b09" stroke="#8d8778"/>
      <text x="149" y="138" fill="#e8e0cf">1</text>
